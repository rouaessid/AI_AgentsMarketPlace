specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: IdentityRegistry
    network: base-sepolia
    source:
      address: "0x1Fc68C0b757f66e26521d89346c61d7172316a90"
      abi: IdentityRegistry
      startBlock: 41965116
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AgentCreated
        - AgentStatusChanged
        - AgentVersionMinted
        - Approval
        - ApprovalForAll
        - BatchMetadataUpdate
        - EIP712DomainChanged
        - MetadataSet
        - MetadataUpdate
        - OwnershipTransferred
        - Transfer
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
      eventHandlers:
        - event: AgentCreated(string,indexed uint256,indexed address,uint8,string,string)
          handler: handleAgentCreated
        - event: AgentStatusChanged(indexed string,uint8,uint8)
          handler: handleAgentStatusChanged
        - event: AgentVersionMinted(string,indexed uint256,indexed uint256,string,string)
          handler: handleAgentVersionMinted
        - event: Approval(indexed address,indexed address,indexed uint256)
          handler: handleApproval
        - event: ApprovalForAll(indexed address,indexed address,bool)
          handler: handleApprovalForAll
        - event: BatchMetadataUpdate(uint256,uint256)
          handler: handleBatchMetadataUpdate
        - event: EIP712DomainChanged()
          handler: handleEIP712DomainChanged
        - event: MetadataSet(indexed uint256,indexed string,string,bytes)
          handler: handleMetadataSet
        - event: MetadataUpdate(uint256)
          handler: handleMetadataUpdate
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/identity-registry.ts
