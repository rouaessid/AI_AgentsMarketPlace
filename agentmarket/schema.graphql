type AgentCreated @entity(immutable: true) {
  id: Bytes!
  agentId: String! # string
  tokenId: BigInt! # uint256
  owner: Bytes! # address
  agentType: Int! # uint8
  agentURI: String! # string
  version: String! # string
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AgentStatusChanged @entity(immutable: true) {
  id: Bytes!
  agentId: String! # string
  oldStatus: Int! # uint8
  newStatus: Int! # uint8
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AgentVersionMinted @entity(immutable: true) {
  id: Bytes!
  agentId: String! # string
  newTokenId: BigInt! # uint256
  previousTokenId: BigInt! # uint256
  agentURI: String! # string
  version: String! # string
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

