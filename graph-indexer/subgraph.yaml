specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: IdentityRegistry
    network: base-sepolia
    source:
      address: "0x23f60CD8B68ee1439BC3AF10BD462c2C4d28c119"
      abi: IdentityRegistry
      startBlock: 42707662
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Agent
        - AgentHashLookup
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
      eventHandlers:
        - event: AgentCreated(string,indexed uint256,indexed address,uint8,string,string)
          handler: handleAgentCreated
        - event: AgentStatusChanged(indexed string,uint8,uint8)
          handler: handleAgentStatusChanged
        - event: AgentVersionMinted(string,indexed uint256,indexed uint256,string,string)
          handler: handleAgentVersionMinted
      file: ./src/identity-registry.ts

  - kind: ethereum
    name: EscrowManager
    network: base-sepolia
    source:
      address: "0xe899039E3774d70D86d1d59021859773DFA301f1"
      abi: EscrowManager
      startBlock: 42707662
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - EscrowEvent
      abis:
        - name: EscrowManager
          file: ./abis/EscrowManager.json
      eventHandlers:
        - event: PaymentDeposited(indexed string,indexed address,uint256)
          handler: handlePaymentDeposited
        - event: PipelinePaymentDeposited(indexed string,indexed address,uint256,uint256)
          handler: handlePipelinePaymentDeposited
        - event: FundsReleased(indexed string,indexed address,uint256,uint256)
          handler: handleFundsReleased
        - event: ClientRefunded(indexed string,indexed address,uint256)
          handler: handleClientRefunded
      file: ./src/escrow-manager.ts

  - kind: ethereum
    name: ValidationRegistry
    network: base-sepolia
    source:
      address: "0xE1aCDb0689CA4684ad7E400591239446b3E2f3dc"
      abi: ValidationRegistry
      startBlock: 42707662
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ValidationEvent
        - AgentScore
        - JudgeScore
        - ValidationRequestEvent
        - ValidationResponseEvent
        - AgentHashLookup
      abis:
        - name: ValidationRegistry
          file: ./abis/ValidationRegistry.json
      eventHandlers:
        - event: ScoreRecorded(indexed uint256,string,uint8,uint8)
          handler: handleScoreRecorded
        - event: JudgeScoreUpdated(indexed address,uint256,uint256)
          handler: handleJudgeScoreUpdated
        - event: ValidationRequest(indexed address,indexed uint256,string,indexed bytes32)
          handler: handleValidationRequest
        - event: ValidationResponse(indexed address,indexed uint256,indexed bytes32,uint8,string,bytes32,string)
          handler: handleValidationResponse
        - event: HoneypotPassed(uint256,string)
          handler: handleHoneypotPassed
        - event: HoneypotFailed(uint256,string)
          handler: handleHoneypotFailed
      file: ./src/validation-registry.ts

  - kind: ethereum
    name: StakingContract
    network: base-sepolia
    source:
      address: "0xBf96c8459ec229E155899294C4E697647E1F37E5"
      abi: StakingContract
      startBlock: 42707662
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - StakeEvent
      abis:
        - name: StakingContract
          file: ./abis/StakingContract.json
      eventHandlers:
        - event: Staked(indexed address,uint256)
          handler: handleStaked
        - event: Unstaked(indexed address,uint256)
          handler: handleUnstaked
        - event: Slashed(indexed address,uint256,string)
          handler: handleSlashed
      file: ./src/staking-contract.ts

  - kind: ethereum
    name: ReputationRegistry
    network: base-sepolia
    source:
      address: "0x6F5178B17f20D94B6f106f6b6b8DCb7aD38CC11E"
      abi: ReputationRegistry
      startBlock: 42707662
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ReputationEvent
      abis:
        - name: ReputationRegistry
          file: ./abis/ReputationRegistry.json
      eventHandlers:
        - event: NewFeedback(indexed uint256,indexed address,uint64,int128,uint8,indexed string,string,string,string,string,bytes32)
          handler: handleNewFeedback
      file: ./src/reputation-registry.ts
